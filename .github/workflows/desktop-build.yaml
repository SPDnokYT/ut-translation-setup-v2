name: Wails build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or tag to build"
        required: true
        default: "v1.2.3"

env:
  APP_NAME: "UntilThen_GV_PC"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - platform: "linux/amd64"
            os: "ubuntu-latest"
            arch: "amd64"
          - platform: "windows/amd64"
            os: "windows-latest"
            arch: "amd64"

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.target_ref || github.ref }}

      - name: Get Tag Name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.target_ref }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Set Binary Name
        shell: bash
        run: |
          PLATFORM_STR=$(echo "${{ matrix.build.platform }}" | tr '/' '-')
          FULL_NAME="${{ env.APP_NAME }}-${{ env.TAG_NAME }}-$PLATFORM_STR"

          if [[ "${{ matrix.build.os }}" == *"windows"* ]]; then
            echo "FINAL_BINARY_NAME=${FULL_NAME}.exe" >> $GITHUB_ENV
          else
            echo "FINAL_BINARY_NAME=${FULL_NAME}" >> $GITHUB_ENV
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Linux Dependencies
        if: matrix.build.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        shell: bash
        run: |
          wails build -platform ${{ matrix.build.platform }} -o ${{ env.FINAL_BINARY_NAME }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          files: build/bin/${{ env.FINAL_BINARY_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}